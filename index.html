<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="입사 빔 크기와 파장, 결정 길이로 후보 렌즈별 집속 허리 w_out, 레일리 길이 z_R, 집속 파라미터 ξ와 type-II PPKTP 결정 설치 위치를 계산합니다.">
<title>PPKTP 집속 렌즈 선택기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 9 L16 16 L2 23Z' fill='%236a3fd4' opacity='.35'/%3E%3Cpath d='M16 16 L30 9 L30 23Z' fill='%236a3fd4' opacity='.35'/%3E%3Crect x='19' y='12' width='9' height='8' fill='none' stroke='%231b8573' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
/* base reset (matches the hosted version) */
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
@media print{:root{padding:0}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: answer first. Essential inputs → recommendation banner → lens list (left, sticky) beside selected-lens detail (right). */
:root{
  --bg:#f5f5f7; --panel:#ffffff; --fg:#17161d; --muted:#5f5c6b; --line:#dddbe4; --line-soft:#ebe9f0;
  --beam:#6a3fd4; --beam-soft:rgba(106,63,212,.16); --beam-band:rgba(106,63,212,.08); --on-beam:#ffffff;
  --crystal:#1b8573; --crystal-soft:rgba(27,133,115,.14);
  --good:#2b7a4b; --good-bg:#e3f2e8; --warn:#9a5a12; --warn-bg:#fbefdc; --bad:#b1362f; --bad-bg:#fbe5e3; --info-bg:#ece7fb;
  --sel:#f0ebff; --spdc:#b0305a; --spdc-soft:rgba(176,48,90,.14); --spdc-bg:#fcedf2;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111016; --panel:#1a1921; --fg:#ecebf3; --muted:#a29fb0; --line:#2f2d39; --line-soft:#25232e;
  --beam:#a58bff; --beam-soft:rgba(165,139,255,.22); --beam-band:rgba(165,139,255,.10); --on-beam:#16121f;
  --crystal:#49c2ab; --crystal-soft:rgba(73,194,171,.16);
  --good:#6fd39a; --good-bg:#183224; --warn:#f0b35f; --warn-bg:#3a2a12; --bad:#ff8a80; --bad-bg:#3b1a18; --info-bg:#2a2340;
  --sel:#262038; --spdc:#ff8db0; --spdc-soft:rgba(255,141,176,.18); --spdc-bg:#2c1822; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111016; --panel:#1a1921; --fg:#ecebf3; --muted:#a29fb0; --line:#2f2d39; --line-soft:#25232e;
  --beam:#a58bff; --beam-soft:rgba(165,139,255,.22); --beam-band:rgba(165,139,255,.10); --on-beam:#16121f;
  --crystal:#49c2ab; --crystal-soft:rgba(73,194,171,.16);
  --good:#6fd39a; --good-bg:#183224; --warn:#f0b35f; --warn-bg:#3a2a12; --bad:#ff8a80; --bad-bg:#3b1a18; --info-bg:#2a2340;
  --sel:#262038; --spdc:#ff8db0; --spdc-soft:rgba(255,141,176,.18); --spdc-bg:#2c1822; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:22px 48px;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header h1{font-size:1.55rem;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);max-width:75ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:.78rem;color:var(--muted)}
.err{color:var(--bad);font-size:.82rem}

/* inputs */
.essentials{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 20px;align-items:start}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
input[type=number],input[type=text],select{font:inherit;font-family:var(--mono);font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
select{font-family:var(--sans)}
input[readonly]{color:var(--muted)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--beam);outline-offset:2px}
.unit{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);flex:1;min-width:0}
.unit input{border:0;background:transparent}
.unit span{padding-right:9px;color:var(--muted);font-size:.85rem;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0;max-width:100%}
.seg button{font:inherit;font-size:.83rem;border:0;background:transparent;color:var(--muted);padding:6px 10px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--beam);color:var(--on-beam)}
.seg.wrap{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));width:100%}
.seg.wrap button{border-left:0;box-shadow:inset -1px -1px 0 var(--line);padding-inline:6px}
#lensSeg{--cols:3}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{font:inherit;font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:1px 9px;cursor:pointer}
.pills button[aria-pressed=true]{border-color:var(--beam);color:var(--beam)}
details.adv{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:10px}
details>summary{cursor:pointer;font-size:.88rem;color:var(--muted);user-select:none}
details>summary:hover{color:var(--fg)}
.advgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 20px;margin-top:12px}
.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}

/* recommendation */
.reco{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:start;border-color:var(--beam);background:var(--sel)}
.reco h2{margin:2px 0 4px;font-size:1.25rem;font-weight:600;text-wrap:balance}
.reco h2 .mono{color:var(--beam)}
.reco p{margin:0;max-width:80ch}
.reco .alts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.alts button{font:inherit;font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:2px 9px;cursor:pointer}
.alts button:hover{border-color:var(--beam)}
.copyrow{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:640px){.reco{grid-template-columns:1fr}.copyrow{align-items:flex-start}}

/* main split */
.split{display:grid;grid-template-columns:minmax(330px,400px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.listpanel{padding:12px 0 6px;display:flex;flex-direction:column;min-height:0}
@media (min-width:1001px){.listpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px)}}
.listhead{padding:0 14px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.listhead h2{margin:0;font-size:1rem;font-weight:600}
.listhead label{font-size:.8rem;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer}
.lcols,.lrow{display:grid;grid-template-columns:62px 1fr 1fr 118px 14px;gap:8px;align-items:center;padding:0 14px}
.lcols{font-size:.72rem;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
.lcols span:not(:first-child){text-align:right}
.list{overflow-y:auto;min-height:0}
.lrow{width:100%;font:inherit;border:0;border-bottom:1px solid var(--line-soft);background:transparent;color:var(--fg);text-align:right;padding-block:7px;cursor:pointer;font-family:var(--mono);font-size:.86rem;font-variant-numeric:tabular-nums}
.lrow:hover{background:var(--bg)}
.lrow[aria-selected=true]{background:var(--sel);box-shadow:inset 3px 0 0 var(--beam)}
.lrow .f{text-align:left;font-weight:500}
.lrow .star{color:var(--beam);margin-left:3px}
.lrow.dim{color:var(--muted)}
.xi{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.xi .xv{text-align:right}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line-soft)}
.bar .zone{position:absolute;top:0;bottom:0;background:var(--good-bg);border-radius:3px}
.bar .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--beam);opacity:.55}
.bar .dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--beam)}
.flag{width:9px;height:9px;border-radius:50%;justify-self:end}
.flag.warn{background:var(--warn)}.flag.bad{background:var(--bad)}
.listfoot{padding:8px 14px 2px;font-size:.75rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.listfoot i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* detail */
.dethead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dethead h2{margin:0;font-size:1.15rem;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line-soft);border-radius:8px;padding:9px 12px;background:var(--bg);min-width:0}
.stat .k{font-size:.76rem;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:1.22rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.8rem;color:var(--muted);font-weight:400;margin-left:3px}
.stat .s{font-size:.74rem;color:var(--muted);font-family:var(--mono)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px 22px;margin-top:16px}
.two>div{min-width:0}
h3{font-size:.92rem;font-weight:600;margin:0 0 6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.86rem}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.kv .em{color:var(--crystal);font-weight:500}
.fig{margin:16px 0 0;overflow-x:auto}
.fig>svg{display:block;width:100%;min-width:620px;height:auto;touch-action:pan-y}
.fig figcaption{font-size:.78rem;color:var(--muted);margin-top:4px}
svg text{font-family:var(--sans);font-size:12px;fill:var(--muted)}
svg text.m{font-family:var(--mono)}
svg text.b{fill:var(--fg);font-weight:500}
.chip{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;white-space:nowrap;font-weight:500}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--beam)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:14px;height:8px;margin-right:6px;vertical-align:middle;border-radius:2px;background:var(--c)}

/* full table + notes */
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:.86rem}
th,td{padding:6px 10px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.76rem}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.c{text-align:left;font-family:var(--sans)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
tbody tr[aria-selected=true]{background:var(--sel)}
.note p{margin:8px 0;max-width:95ch;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.lrow,tbody tr{transition:background .12s}}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stagehead{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;padding-top:18px;margin-top:6px;border-top:1px dashed var(--line)}
.stagehead.first{border-top:0;padding-top:4px;margin-top:0}
.stagehead .eyebrow{color:var(--beam);font-weight:600}
.stagehead h2{margin:0;font-size:1.2rem;font-weight:600}
.stagehead.s2 .eyebrow{color:var(--spdc)}
.reco.r2{border-color:var(--spdc);background:var(--spdc-bg)}
.reco.r2 h2 .mono{color:var(--spdc)}
.r2list .lrow[aria-selected=true]{box-shadow:inset 3px 0 0 var(--spdc);background:var(--spdc-bg)}
.r2list .bar .dot{background:var(--spdc)}
.r2list .bar .tgt{background:var(--spdc)}
.r2list .lrow .star{color:var(--spdc)}
.chip.spdc{background:var(--spdc-bg);color:var(--spdc)}
/* LaTeX (MathJax SVG). Fallback HTML stays visible until MathJax is ready or if it cannot load. */
.tex{white-space:nowrap}
.tex mjx-container{display:inline-block;line-height:0}
.tex mjx-container>svg{overflow:visible;vertical-align:middle}
.tex.disp{display:block;white-space:normal;overflow-x:auto;overflow-y:hidden;padding:4px 0;text-align:center;font-family:var(--mono);color:var(--fg)}
.tex.disp.ok{font-family:inherit}
.tex.disp mjx-container{display:inline-block;font-size:1.08em}
.eqs{display:flex;flex-wrap:wrap;gap:2px 44px;margin:4px 0 10px;align-items:center}
.eqs>.tex.disp{flex:0 1 auto;max-width:100%}
.note .eqs .tex.disp{text-align:left}
.ps-eqs{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10pt;margin:3pt 0 2pt}
.ps-eqs .tex.disp{font-size:8pt;padding:1pt 0;text-align:left;overflow:visible}

/* A4 print summary */
#printSheet{display:none}
#printSheet h1{font-size:13pt;margin:2pt 0 0;font-weight:600;text-wrap:balance}
#printSheet h1 .mono{color:var(--beam)}
#printSheet h2{font-size:9.5pt;font-weight:600;margin:0 0 4pt;color:var(--fg)}
.ps-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12pt;border-bottom:1.2pt solid var(--fg);padding-bottom:5pt;margin-bottom:7pt}
.ps-eyebrow{font-size:7.5pt;letter-spacing:.06em;color:var(--muted)}
.ps-meta{font-size:8pt;color:var(--muted);text-align:right;font-family:var(--mono);max-width:62mm;flex-shrink:0}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:6pt;margin-bottom:6pt}
.ps-box{border:.75pt solid var(--line);border-radius:4pt;padding:5pt 8pt;break-inside:avoid}
.ps-box dl{display:grid;grid-template-columns:auto 1fr;gap:1.5pt 10pt;margin:0;font-size:8.5pt}
.ps-box dt{color:var(--muted);white-space:nowrap}
.ps-box dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ps-key{border-color:var(--crystal);background:var(--crystal-soft)}
.ps-big{display:grid;grid-template-columns:repeat(3,1fr);gap:4pt;margin:2pt 0 6pt}
.ps-big div{display:flex;flex-direction:column}
.ps-big span{font-size:7.5pt;color:var(--muted)}
.ps-big b{font-family:var(--mono);font-size:15pt;font-weight:500;color:var(--crystal);font-variant-numeric:tabular-nums}
.ps-big small{font-size:8pt;color:var(--muted);font-weight:400}
.ps-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4pt 8pt}
.ps-stats>div>span{display:block;color:var(--muted);font-size:7pt;white-space:nowrap}
.ps-stats b{font-family:var(--mono);font-weight:500;font-size:9.5pt;font-variant-numeric:tabular-nums}
.ps-fig{margin:5pt 0 0;break-inside:avoid}
.ps-fig>svg{width:100%;height:auto;max-height:32mm;display:block}
.ps-fig figcaption{font-size:7pt;color:var(--muted)}
#printSheet table.ps-table{width:100%;min-width:0;border-collapse:collapse;font-size:8pt;margin-top:2pt}
#printSheet .ps-table th,#printSheet .ps-table td{padding:2pt 5pt;border-bottom:.5pt solid var(--line);text-align:right;white-space:nowrap}
#printSheet .ps-table th{font-size:7pt}
#printSheet .ps-table th:first-child,#printSheet .ps-table td:first-child,#printSheet .ps-table td.c{text-align:left}
#printSheet .ps-table tr.best td{font-weight:600}
.ps-foot{font-size:7pt;color:var(--muted);margin:6pt 0 0;border-top:.75pt solid var(--line);padding-top:4pt;line-height:1.45}
@media print{
  @page{size:A4;margin:11mm 13mm}
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#ffffff;--panel:#ffffff;--fg:#111015;--muted:#55525f;--line:#cfccd8;--line-soft:#e4e2ea;--beam:#5a32c4;--beam-soft:rgba(90,50,196,.16);--beam-band:rgba(90,50,196,.08);--crystal:#17705f;--crystal-soft:rgba(23,112,95,.13);--good:#22663e;--good-bg:#e3f2e8;--warn:#86500f;--warn-bg:#fbefdc;--bad:#a12f28;--bad-bg:#fbe5e3;--info-bg:#ece7fb;--sel:#f0ebff;--spdc:#a32a52;--spdc-soft:rgba(163,42,82,.14);--spdc-bg:#fcedf2;color-scheme:light}
  html,body{background:#fff!important}
  body{padding:0;font-size:9.5pt;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{display:none!important}
  #printSheet{display:block}
}
/* header tools, lens step toggle, page foot */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap}
.top>div:first-child{min-width:0;flex:1 1 420px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tools .hint,.pagefoot .hint{max-width:22ch;text-align:right}
.listtools{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:0 14px 8px}
.listtools label{font-size:.8rem;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer}
.steprow{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.seg.mini button{padding:3px 9px;font-size:.78rem;font-family:var(--mono)}
.pagefoot{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.reco .eyebrow{text-transform:none;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <div class="eyebrow">Gaussian beam · type-II PPKTP</div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="intro"></p>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Language / 언어" id="langSeg">
      <button type="button" data-lang="ko" lang="ko">한국어</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <button type="button" class="btn printBtn" id="printTop" data-i18n="printBtn"></button>
    <span class="hint printMsg" aria-live="polite"></span>
  </div>
</header>

<section class="panel" data-i18n-aria="inputsAria">
  <div class="essentials">
    <div class="field">
      <label for="beamSize" data-i18n="beamSize"></label>
      <div class="row nw">
        <div class="unit"><input type="number" id="beamSize" value="0.665" step="0.001" min="0" inputmode="decimal"><span>mm</span></div>
        <div class="seg" role="group" data-i18n-aria="radiusOrDiam">
          <button type="button" id="modeR" aria-pressed="true" data-i18n="radius"></button>
          <button type="button" id="modeD" aria-pressed="false" data-i18n="diameter"></button>

  ps2H:(n,l)=>`평행광 렌즈 (2단계) · ${n} ${l} nm`, ps2f:"평행광 렌즈 초점거리", ps2from1:"집속 렌즈에서", ps2fromBack:"결정 뒷면에서", ps2tol:"렌즈 위치 허용", ps2out:"출력 허리 (렌즈 뒤)",
  ps2D:`평행광 직경 2${SYM.wp}`, ps2Dt:"목표 직경", ps2Th:`발산 반각 ${SYM.th}`, ps2Zr:`${SYM.zRp} (평행 유지)`, ps2W0:`결정 안 허리 ${SYM.w0}`,
  psLayoutCap:"전체 배치도. 가로는 실제 거리 비율, 세로(빔 반경, 결정 두께)는 같은 배율로 확대.", psLayoutCap2:" 결정 중심부터는 평행광으로 만들 빛.",
  psZoomCap:"결정 부근 확대도. 가로는 렌즈로부터 거리(mm), 세로는 빔 반경(μm), 보라색 띠는 결정 안 레일리 범위 b.",
  psNb:"이웃 집속 렌즈 비교", psSel:"선택", psStatus:"판정",
  psNbHead:`<th>f (mm)</th><th>${SYM.wout} (μm)</th><th>${SYM.zR} 공기 (mm)</th><th>${SYM.zR} 결정 (mm)</th><th>ξ</th><th>앞면 (mm)</th><th>중심 (mm)</th><th>면 빔 직경 (μm)</th><th style="text-align:left">판정</th>`,
  psFoot:"얇은 렌즈, Self 공식. 거리는 렌즈 주평면 기준(평볼록 렌즈는 곡면 쪽 꼭짓점 근처). ★ = 추천 렌즈(개구 투과율 99.5% 이상·최소 간격을 만족하며 ξ가 목표에 가장 가까운 것). 평행광 렌즈: 겉보기 허리에서 f₂ 떨어진 f–f 배치, SPDC 모드는 펌프와 같은 b 가정. 굴절률 자동값은 KTP n_y Sellmeier(Kato & Takaoka 2002).",
  notesSum:"계산 방법과 가정",
  notesBody:()=>`<p><b>집속 허리</b> (Self의 가우시안 빔 렌즈 공식, 얇은 렌즈). 입사 허리가 렌즈 앞 ${SYM.din}에 있을 때:</p>
  <div class="eqs">${EQ.wout}${EQ.dout}</div>
  <p><b>레일리 길이와 근사식.</b> 근사식과의 차이는 상세 정보에 표시합니다.</p>
  <div class="eqs">${EQ.zRin}${EQ.zR}${EQ.approx}</div>
  <p><b>결정 안.</b> 레일리 길이가 n배 늘어나고, 길이 L인 결정은 공기 L/n과 같아서 허리가 Δz만큼 뒤로 밀립니다. 그래서 허리를 결정 중심에 두려면 앞면을 ${SYM.zfront}에 놓습니다.</p>
  <div class="eqs">${EQ.xi}${EQ.front}${EQ.face}</div>
  <p><b>개구 투과율.</b> 결정 두께 t, 폭 W 방향의 가우시안 클리핑으로 계산해 99.5% 미만이면 경고합니다.</p>
  <div class="eqs">${EQ.T}</div>
  <p><b>ξ 고르기.</b> ${SYM.xiBK}는 Boyd–Kleinman 최적(SHG, SPDC 쌍 생성률 최대)이고, ${SYM.xiLe1}은 단일모드 수집 효율과 스펙트럼 순도에 유리하다고 알려져 있습니다. 결정 안 레일리 길이가 결정 길이 이상(z_R^KTP ≥ L)이 되려면 ξ ≤ 0.5를 고르세요. 추천 렌즈는 개구와 간격 조건을 만족하는 렌즈 중 ${SYM.lnxi}가 가장 작은 것입니다. 근사식 오차가 1%를 넘으면 표시합니다.</p>
  <p><b>굴절률 자동값.</b> KTP ${SYM.ny} Sellmeier 식(Kato &amp; Takaoka, Appl. Opt. 41, 5040, 2002; 유효 범위 0.43–3.54 μm)입니다. 405 nm는 범위 밖 외삽이므로 결정 데이터시트 값이 있으면 직접 입력하세요.</p>
  <div class="eqs">${EQ.sell}</div>
  <p><b>2단계, 평행광 렌즈.</b> 결정 밖에서 보면 허리는 결정 뒷면에서 ${SYM.L2n}만큼 안쪽에 있는 것처럼 보입니다(겉보기 허리). 이 겉보기 허리에서 렌즈 2까지의 거리를 ${SYM.d2x}로 두면 Self 공식이 그대로 적용됩니다. 기본값은 ${SYM.x0}(f–f 배치)이며, 이때 출력 허리는 렌즈 뒤 정확히 ${SYM.f2}에 생깁니다.</p>
  <div class="eqs">${EQ.app}${EQ.wp}${EQ.theta}</div>
  <p>평행광 허리를 렌즈 뒤 거리 D에 두려면 ${SYM.quad}의 작은 근을 씁니다. 이 근은 ${SYM.reach}일 때만 있습니다. 렌즈 위치 오차 x는 출력 허리를 ${SYM.shift}만큼 옮기므로, ${SYM.tol}이면 출력 허리가 ${SYM.zRp} 안에서 움직입니다. 이 값을 렌즈 위치 허용 범위로 표시합니다.</p>
  <p><b>SPDC 수집 모드.</b> 축퇴 type-II SPDC(${SYM.degen})에서 수집 모드가 펌프와 같은 공초점 파라미터 b를 가진다고 가정하면 허리 반경은 다음과 같습니다. 고급 설정에서 다른 가정으로 바꿀 수 있습니다.</p>
  <div class="eqs">${EQ.ws}</div>
  <p><b>한계.</b> 거리는 얇은 렌즈의 주평면 기준입니다. 평볼록 렌즈는 주평면이 곡면 쪽 꼭짓점 근처에 있으니 마운트 위치를 보정하세요. 결정 면의 반사, 열 렌즈, 비대칭 빔은 고려하지 않았습니다.</p>`
},

function erf(x){const s=Math.sign(x);x=Math.abs(x);const tt=1/(1+0.3275911*x);return s*(1-(((((1.061405429*tt-1.453152027)*tt)+1.421413741)*tt-0.284496736)*tt+0.254829592)*tt*Math.exp(-x*x));}

}
function readInputs(){

function validate(P){

function compute(f){
  const le=P.lam*1e-6*P.m2;

  const dOut=f+x*f*f/den, wOut=P.win*f/Math.sqrt(den), wApprox=f*le/(Math.PI*P.win);
  const zRair=Math.PI*wOut*wOut/le, zRcr=P.n*zRair, b=2*zRcr, xi=P.L/b;
  const front=dOut-P.L/(2*P.n), center=front+P.L/2, back=front+P.L;
  const wFace=wOut*Math.sqrt(1+xi*xi);
  const T=erf(Math.SQRT2*(P.apH/2)/wFace)*erf(Math.SQRT2*(P.apW/2)/wFace);
  const r={f,zRin,dOut,wOut,wApprox,zRair,zRcr,b,xi,front,center,back,wFace,T,
    wLens:P.win*Math.sqrt(1+(P.dIn/zRin)**2), approxErr:(wApprox-wOut)/wOut,

/* ---------- beam envelopes ---------- */
function wAt(r,z){
  if(z<0)return P.win*Math.sqrt(1+((z+P.dIn)/r.zRin)**2);
  const zeq=z<r.front?z:z<=r.back?r.front+(z-r.front)/P.n:z-P.L*(1-1/P.n);
  return r.wOut*Math.sqrt(1+((zeq-r.dOut)/r.zRair)**2);
}
function envPath(fn,z0,z1,X,Y,N){
  const top=[],bot=[];
  for(let i=0;i<=N;i++){const z=z0+(z1-z0)*i/N,w=fn(z),x=X(z).toFixed(1);top.push(x+" "+Y(w).toFixed(1));bot.push(x+" "+Y(-w).toFixed(1));}
  return {fill:"M"+top.join(" L")+" L"+bot.slice().reverse().join(" L")+" Z",top:"M"+top.join(" L"),bot:"M"+bot.join(" L")};
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const m=raw/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p;}

function hover(e){

function source(r1){
  const lamAuto=$("lamSMode").value==="auto", nAuto=$("nSMode").value==="auto";
  if(lamAuto)$("lamS").value=+(2*P.lam).toFixed(4);
  $("lamS").readOnly=lamAuto;
  const lamS=+$("lamS").value;
  if(nAuto&&lamS>0)$("nS").value=nKTPy(lamS/1000).toFixed(4);
  $("nS").readOnly=nAuto;
  const nS=+$("nS").value, ma=$("modeAssume").value;
  $("wsBox").hidden=ma!=="manual";
  if($("src").value==="pump")return {kind:"pump",name:t("pump"),lam:P.lam,n:P.n,m2:P.m2,w0:r1.wOut};
  const w0=ma==="sameb"?r1.wOut*Math.sqrt(lamS*P.n/(P.lam*nS)):ma==="samew"?r1.wOut:(+$("wsManual").value)/1000;
  return {kind:"spdc",name:t("spdc"),lam:lamS,n:nS,m2:1,w0};
}
function compute2(r1,Sx,f2,D,Dt){
  const le=Sx.lam*1e-6*Sx.m2, zR=Math.PI*Sx.w0*Sx.w0/le;
  const zApp=r1.back-P.L/(2*Sx.n);
  let x=0, reach=true;
  const a=(D>0)?D-f2:0;
  if(Math.abs(a)>1e-9){const disc=f2**4-4*a*a*zR*zR;if(disc<0){reach=false;x=zR*Math.sign(a);}else x=(f2*f2-Math.sqrt(disc))/(2*a);}
  const d=f2+x, z2=zApp+d, gap=z2-r1.back, den=x*x+zR*zR;
  const wP=Sx.w0*f2/Math.sqrt(den), outW=f2+f2*f2*x/den, zRp=Math.PI*wP*wP/le, theta=le/(Math.PI*wP);
  const wLens=Sx.w0*Math.sqrt(1+(d/zR)**2), w1m=wP*Math.sqrt(1+((1000-outW)/zRp)**2);
  const r={f:f2,zR,zApp,x,d,z2,gap,wP,outW,zRp,theta,wLens,w1m,reach,ratio:2*wP/Dt};
  r.gapOK=gap>=P.minGap; r.ok=r.gapOK&&reach;

  return r;
}
function problems2(r){

}

function validate2(){

function w2At(r1,r2,Sx,z){

}

function colSVG(r){
  const x0=70,x1=870,y0=20,y1=200, Dt=+$("dTarget").value;
  const col=S&&S.kind==="pump"?"var(--beam)":"var(--spdc)", band=S&&S.kind==="pump"?"var(--beam-band)":"var(--spdc-soft)";
  const Xmax=Math.min(5000,Math.max(300,r.outW+2*r.zRp));
  let ymax=0;for(let i=0;i<=200;i++){const z=Xmax*i/200;ymax=Math.max(ymax,2*r.wP*Math.sqrt(1+((z-r.outW)/r.zRp)**2));}
  ymax=Math.max(ymax,Dt)*1.2;
  const X=z=>x0+z/Xmax*(x1-x0), Y=v=>y1-v/ymax*(y1-y0);
  let s="";
  const ys=niceStep(ymax/4);
  for(let v=0;v<=ymax+1e-9;v+=ys)s+=`<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-soft)"/><text x="${x0-8}" y="${Y(v)+4}" text-anchor="end" class="m">${sig(v,3)}</text>`;
  s+=`<text x="${x0-8}" y="${y0-6}" text-anchor="end">mm</text>`;
  const a=Math.max(0,r.outW-r.zRp), b=Math.min(Xmax,r.outW+r.zRp);
  if(b>a)s+=`<rect x="${X(a)}" y="${y0}" width="${X(b)-X(a)}" height="${y1-y0}" fill="${band}" opacity=".7"/>`;
  s+=`<line x1="${x0}" x2="${x1}" y1="${Y(Dt)}" y2="${Y(Dt)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${x1}" y="${Y(Dt)-6}" text-anchor="end">${t("svTarget",sig(Dt,3))}</text>`;
  let d="";for(let i=0;i<=300;i++){const z=Xmax*i/300;d+=(i?"L":"M")+X(z).toFixed(1)+" "+Y(2*r.wP*Math.sqrt(1+((z-r.outW)/r.zRp)**2)).toFixed(1);}
  s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`;
  if(r.outW>0&&r.outW<Xmax)s+=`<line x1="${X(r.outW)}" x2="${X(r.outW)}" y1="${y0}" y2="${y1}" stroke="${col}" stroke-dasharray="2 3"/><text x="${X(r.outW)+5}" y="${y0+12}" style="fill:${col}">${t("svOutWaist")}</text>`;
  const xs=niceStep(Xmax/6);
  for(let v=0;v<=Xmax+1e-9;v+=xs)s+=`<text x="${X(v)}" y="${y1+18}" text-anchor="middle" class="m">${sig(v,4)}</text>`;
  s+=`<text x="${(x0+x1)/2}" y="${y1+38}" text-anchor="middle">${t("svColAxis")}</text>`;
  return s;
}
function select2(f,from){
  selF2=f;userPicked2=true;run2();
  const btn=$("opt2-"+f);
  if(from==="key"&&btn){btn.focus();btn.scrollIntoView({block:"nearest"});}
  if(from==="click"&&window.matchMedia("(max-width:1000px)").matches){
    $("detail2").scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  }
}
$("list2").addEventListener("click",e=>{const b=e.target.closest(".lrow");if(b)select2(+b.dataset.f,"click");});
$("list2").addEventListener("keydown",e=>{
  if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
  const btns=[...$("list2").querySelectorAll(".lrow")];const i=btns.findIndex(b=>+b.dataset.f===selF2);
  const j=Math.max(0,Math.min(btns.length-1,i+(e.key==="ArrowDown"?1:-1)));
  if(btns[j]){e.preventDefault();select2(+btns[j].dataset.f,"key");}
});
$("reco2Alts").addEventListener("click",e=>{const b=e.target.closest("button");if(b)select2(+b.dataset.f,"click");});

/* ---------- copy ---------- */
$("copyBtn").addEventListener("click",()=>{
  const r=rows.find(x=>x.f===selF);if(!r)return;
  const txt=[t("copyHead",P.lam,sig(P.win,4),sig(P.L,3),P.n.toFixed(4),P.m2),
    t("copyL1",fmm(r.f),fx(r.wOut*1000,2),sig(r.zRair,4),sig(r.zRcr,4),sig(r.b,4),sig(r.xi,3)),
    t("copyPos",fx(r.front,2),fx(r.center,2),fx(r.back,2)),
    t("copyFace",fx(2*r.wFace*1000,1),sig(P.apH,3),sig(P.apW,3),fx(r.T*100,2))];
  const c=st2&&rows2.find(x=>x.f===selF2);
  if(c&&S)txt.push(t("copyL2",S.name,sig(S.lam,5),fx(S.w0*1000,2),fmm(c.f),fx(c.z2,2),fx(c.gap,2),sig(c.zR,3)),t("copyL2b",fx(2*c.wP,3),fx(c.theta*1000,3),fmtLen(c.zRp),fx(c.outW,1)));
  const out=txt.join("\n");
  const done=m=>{$("copyMsg").textContent=m;setTimeout(()=>$("copyMsg").textContent="",2500);};
  try{navigator.clipboard.writeText(out).then(()=>done(t("copied")),()=>fallback(out,done));}catch(e){fallback(out,done);}
});
function fallback(txt,done){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="absolute";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();done(ok?t("copied"):t("copyBlocked"));}

/* ---------- A4 print summary: the lenses the user selected ---------- */
function buildPrint(){
  if(!P||!rows.length||validate(P))return false;
  const sel=rows.find(r=>r.f===selF), okAny=rows.some(r=>r.ok);
  const c2=st2?rows2.find(r=>r.f===selF2):null;
  const goal=t("goal")[$("xiTarget").value]||t("goalCustom");
  const now=new Date(), pd=n=>String(n).padStart(2,"0");
  const stamp=`${now.getFullYear()}-${pd(now.getMonth()+1)}-${pd(now.getDate())} ${pd(now.getHours())}:${pd(now.getMinutes())}`;
  const lm=$("lensMode").value;
  const lensDesc=lm==="step"?t("psLensStep",fmm(+$("fMin").value),fmm(+$("fMax").value),fmm(+$("fStep").value),rows.length):lm==="std"?t("psLensStd",rows.length):t("psLensList",rows.length);
  const i=rows.indexOf(sel);
  const nb=rows.slice(Math.max(0,i-1),i+2);
  const st=(k,v)=>`<div><span>${k}</span><b>${v}</b></div>`;
  const status=r=>[xiClass(r.xi)[0],...problems(r).map(x=>x[1])].join(", ");
  const href=/^https?:/.test(location.href)?location.href.split("#")[0]:"";
  const isBest=sel.f===bestF&&(!c2||c2.f===bestF2);
  const bestLine=isBest?t("psIsBest"):t("psBest",fmm(bestF),c2?fmm(bestF2):"");
  const tbl=nb.map(r=>`<tr class="${r.f===sel.f?"best":""}"><td>${fmm(r.f)}${r.f===bestF?" ★":""}${r.f===sel.f?` (${t("psSel")})`:""}</td><td>${fx(r.wOut*1000,2)}</td><td>${sig(r.zRair,4)}</td><td>${sig(r.zRcr,4)}</td><td>${sig(r.xi,3)}</td><td>${fx(r.front,2)}</td><td>${fx(r.center,2)}</td><td>${fx(2*r.wFace*1000,1)}</td><td class="c">${status(r)}</td></tr>`).join("");
  $("printSheet").innerHTML=`
  <div class="ps-head">
    <div><div class="ps-eyebrow">${t("psEyebrow")}${okAny?"":" · "+t("noneOk")}</div>
    <h1>${t("psTitle",fmm(sel.f),fx(sel.front,1),c2?fmm(c2.f):"",c2?fx(c2.gap,1):"")}</h1></div>
    <div class="ps-meta">${stamp}<br>ξ = ${sig(P.xiT,3)} (${goal})<br>${bestLine}</div>
  </div>
  <div class="ps-grid">
    <section class="ps-box"><h2>${t("psInputs")}</h2><dl>
      <dt>${t("psLam")}</dt><dd>${P.lam} nm</dd>
      <dt>${t("psBeam")}</dt><dd>w = ${sig(P.win,4)} mm · 2w = ${sig(2*P.win,4)} mm</dd>
      <dt>${t("psM2")}</dt><dd>${P.m2} · ${sig(P.dIn,4)} mm</dd>
      <dt>${t("psL")}</dt><dd>${sig(P.L,4)} mm</dd>
      <dt>${t("psAp")}</dt><dd>${sig(P.apH,3)} × ${sig(P.apW,3)} mm</dd>
      <dt>${t("psN")}</dt><dd>${P.n.toFixed(4)} ${$("nMode").value==="auto"?t("psNauto"):t("psNman")}</dd>
      <dt>${t("psGap")}</dt><dd>${sig(P.minGap,3)} mm</dd>
      <dt>${t("psLens")}</dt><dd>${lensDesc}</dd>
    </dl></section>
    <section class="ps-box ps-key"><h2>${t("psPos")}</h2>
      <div class="ps-big">
        <div><span>${t("pFront")}</span><b>${fx(sel.front,2)}<small> mm</small></b></div>
        <div><span>${t("pCenter")}</span><b>${fx(sel.center,2)}<small> mm</small></b></div>
        <div><span>${t("pBack")}</span><b>${fx(sel.back,2)}<small> mm</small></b></div>
      </div>
      <dl>
        <dt>${t("pF")}</dt><dd>${fx(sel.f,2)} mm</dd>
        <dt>${t("pDout")}</dt><dd>${fx(sel.dOut,2)} mm</dd>
        <dt>${t("pShift")}</dt><dd>+${fx(P.L/2*(1-1/P.n),2)} mm</dd>
      </dl>
    </section>
  </div>
  <section class="ps-box"><h2>${t("psBeamH",fmm(sel.f))}</h2><div class="ps-stats">
    ${st(t("sWout"),fx(sel.wOut*1000,2)+" μm")}
    ${st(t("psWdiam"),fx(2*sel.wOut*1000,1)+" μm")}
    ${st(t("sZR"),sig(sel.zRair,4)+" mm")}
    ${st(t("sZRK"),sig(sel.zRcr,4)+" mm")}
    ${st("b = 2"+SYM.zRK,sig(sel.b,4)+" mm")}
    ${st(t("psXiCls",xiClass(sel.xi)[0]),sig(sel.xi,3))}
    ${st(t("rFace"),fx(2*sel.wFace*1000,1)+" μm")}
    ${st(t("psT"),fx(sel.T*100,2)+"%")}
    ${st(t("psLFor"),sig(sel.b,3)+" / "+sig(2.84*sel.b,3)+" mm")}
    ${st(t("psApErr"),(sel.approxErr>=0?"+":"")+fx(sel.approxErr*100,2)+"%")}
  </div></section>
  ${c2?`<section class="ps-box" style="margin-top:7pt;border-color:var(--spdc)"><h2>${t("ps2H",S.name,sig(S.lam,5))}${st2.okAny?"":" · "+t("noneOk")}</h2><div class="ps-stats">
    ${st(t("ps2f"),"f = "+fmm(c2.f)+" mm")}
    ${st(t("ps2from1"),fx(c2.z2,2)+" mm")}
    ${st(t("ps2fromBack"),fx(c2.gap,2)+" mm")}
    ${st(t("ps2tol"),"±"+sig(c2.zR,3)+" mm")}
    ${st(t("ps2out"),fx(c2.outW,1)+" mm")}
    ${st(t("ps2D"),fx(2*c2.wP,3)+" mm")}
    ${st(t("ps2Dt"),sig(st2.Dt,3)+" mm")}
    ${st(t("ps2Th"),fx(c2.theta*1000,3)+" mrad")}
    ${st(t("ps2Zr"),fmtLen(c2.zRp))}
    ${st(t("ps2W0"),fx(S.w0*1000,2)+" μm")}
  </div></section>`:""}
  <figure class="ps-fig"><svg viewBox="0 0 900 ${c2?280:270}" role="img">${c2?systemSVG(sel,c2,S):layoutSVG(sel)}</svg>
    <figcaption>${t("psLayoutCap")}${c2?t("psLayoutCap2"):""}</figcaption></figure>
  <figure class="ps-fig"><svg viewBox="0 0 900 270" role="img">${zoomSVG(sel,false).s}</svg>
    <figcaption>${t("psZoomCap")}</figcaption></figure>
  <section class="ps-box" style="margin-top:6pt"><h2>${t("psNb")}</h2>
    <table class="ps-table"><thead><tr>${t("psNbHead")}</tr></thead><tbody>${tbl}</tbody></table>
  </section>
  <div class="ps-eqs">${EQ.wout}${EQ.psXi}${EQ.psWs}</div>
  <p class="ps-foot">${t("psFoot")}${href?` · ${href}`:""}</p>`;
  typesetIn($("printSheet"));
  return true;
}
function doPrint(btn){
  const msg=btn.parentElement.querySelector(".printMsg");
  if(!buildPrint()){if(msg){msg.textContent=t("printErr");setTimeout(()=>msg.textContent="",2500);}return;}
  window.print();
}
document.querySelectorAll(".printBtn").forEach(b=>b.addEventListener("click",()=>doPrint(b)));
window.addEventListener("beforeprint",buildPrint);
let framed=true;try{framed=window.self!==window.top;}catch(e){}
if(framed)document.querySelectorAll(".printBtn").forEach(b=>b.hidden=true);

$("modeD").onclick=()=>{if(beamMode==="d")return;const v=+$("beamSize").value;beamMode="d";if(v>0)$("beamSize").value=+(v*2).toPrecision(6);run();};
$("Lpresets").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("L").value=b.dataset.v;userPicked=false;run();});
$("xiSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("xiTarget").value=b.dataset.v;userPicked=false;run();if(b.dataset.v==="custom")$("xiCustom").focus();});
$("lensSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("lensMode").value=b.dataset.v;userPicked=false;run();});
document.querySelectorAll(".stepSeg").forEach(seg=>seg.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const v=+b.dataset.step;
  $("lensMode").value="step";$("fStep").value=v;$("fMin").value=v;
  if(+$("fMax").value<v)$("fMax").value=400;
  userPicked=false;userPicked2=false;run();
}));
document.querySelectorAll(".stepSeg2").forEach(seg=>seg.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;$("lens2Step").value=b.dataset.step;userPicked2=false;run2();
}));
$("srcSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("src").value=b.dataset.v;userPicked2=false;run2();});
$("dPresets").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("dTarget").value=b.dataset.v==="in"?+(2*P.win).toPrecision(4):b.dataset.v;userPicked2=false;run2();});
$("advBox").addEventListener("toggle",save);
$("adv2").addEventListener("toggle",save);
$("resetBtn").addEventListener("click",()=>{ids.forEach(k=>{const e=$(k);if(e.type==="checkbox")e.checked=DEF[k];else e.value=DEF[k];});beamMode="r";userPicked=false;userPicked2=false;run();});
const resetPick=new Set(["beamSize","lambda","L","xiCustom","fMin","fMax","fStep","fList","apH","apW","minGap","nMode","nVal","dIn","m2"]);
ids.forEach(k=>{const e=$(k);if(e.type==="hidden")return;e.addEventListener("input",()=>{if(IDS2.has(k)){if(k!=="onlyOK2")userPicked2=false;run2();return;}if(resetPick.has(k)){userPicked=false;userPicked2=false;}run();});});

try{const l=localStorage.getItem(LANGKEY);if(l==="en"||l==="ko")lang=l;}catch(e){}
load();applyStatic();run();
if(window.__mjLoaded)window.__mjReady();
})();
